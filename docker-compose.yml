version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: fraud_detection_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_detection
    ports:
      - "5432:5432"
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fraud_detection_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://fraud_user:fraud_pass@db:5432/fraud_detection
    ports:
      - "8000:8000"

  ui:
    build: ./claims-ui
    container_name: fraud_detection_ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  fraud_pgdata: